# Contacts: NPSP -> Nonprofit Cloud
#
# See accounts-households.yaml for relationship/confidence value definitions.

object_mapping:
  npsp_side:
    object_api_name: "Contact (standard), child of a Household Account"
    summary: >
      NPSP keeps the standard Contact object as the individual constituent record, related to a
      Household Account for grouping and rollups.
  nonprofit_cloud_side:
    object_api_name: "Account + Contact merged into a single Person Account record"
    summary: >
      Person Accounts collapse Account and Contact into one record. Most standard Contact fields
      (name, email, phone, mailing address) survive as Person Account fields with the same or a
      near-identical API name, since Person Accounts expose the underlying Contact fields
      directly on the Account record.
  relationship: renamed
  notes: >
    This is the most "direct" of the major object changes - most demographic/contact-info fields
    keep the same meaning and often the same API name, just accessed through a Person Account
    record instead of a standalone Contact. The structural risk here is less about individual
    fields and more about anything that assumed "a Contact belongs to a Household Account with
    siblings" - that grouping assumption breaks (see accounts-households.yaml).
  sources:
    - https://www.level12.io/blog/person-accounts-groups-relationships-nonprofit-cloud
    - https://magicfuse.co/blog/salesforce-nonprofit-cloud-vs-npsp

fields:
  - npsp_field: "Contact.FirstName / LastName"
    npsp_label: "First Name / Last Name"
    nonprofit_cloud_field: "Account.FirstName / Account.LastName (Person Account)"
    nonprofit_cloud_label: "First Name / Last Name"
    relationship: direct
    confidence: confirmed
    notes: "Standard Salesforce Person Account behavior - these fields are exposed directly on Account when Person Accounts are enabled."
    sources:
      - https://www.level12.io/blog/person-accounts-groups-relationships-nonprofit-cloud

  - npsp_field: "Contact.Email / Contact.Phone / Contact.MailingAddress"
    npsp_label: "Email / Phone / Mailing Address"
    nonprofit_cloud_field: "Account.PersonEmail / Account.Phone / Account.BillingAddress (Person Account)"
    nonprofit_cloud_label: "Person Email / Phone / Billing Address"
    relationship: renamed
    confidence: confirmed
    notes: "Standard Person Account field renames (Contact.MailingAddress becomes Account.BillingAddress on the Person Account record) - this is core Salesforce platform behavior, not Nonprofit Cloud-specific."
    sources:
      - https://www.level12.io/blog/person-accounts-groups-relationships-nonprofit-cloud

  - npsp_field: "Contact.npo02__TotalOppAmount__c / npo02__NumberOfClosedOpps__c (individual rollups)"
    npsp_label: "Total Gifts / Number of Gifts (contact-level rollup)"
    nonprofit_cloud_field: "DonorGiftSummary"
    nonprofit_cloud_label: "Donor Gift Summary"
    relationship: redesign_required
    confidence: confirmed
    notes: "Same DonorGiftSummary object referenced in accounts-households.yaml - it summarizes gifts for both accounts and contacts per Salesforce's own object description."
    sources:
      - https://developer.salesforce.com/docs/atlas.en-us.nonprofit_cloud.meta/nonprofit_cloud/npc_fundraising_standard_objects.htm

  - npsp_field: "Contact.npsp__Deceased__c"
    npsp_label: "Deceased"
    nonprofit_cloud_field: "Not confirmed against Salesforce documentation reviewed for this map"
    nonprofit_cloud_label: "n/a"
    relationship: no_equivalent
    confidence: unconfirmed
    notes: "Open item pending a source-backed confirmation. File an issue if you've verified this in a live org."
    sources: []
